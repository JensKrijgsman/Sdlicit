# ---------------------------------------------------------------------------
# Sdlicit — Full Stack
#
# Usage:
#   SDLICIT_PROJECT_DIR=/path/to/project docker compose -f services/compose.yaml up -d --build
#   docker compose -f services/compose.yaml down
#
# Services:
#   sdlicit-backend — the Sdlicit API server (port 8000)
#   sdlicit-db      — Postgres 16 with pgvector and AGE (port 5432)
#   ollama          — Ollama model server (port 11434, GPU)
#   lightrag        — LightRAG API server and WebUI (port 9621)
#
# See ../docs/deployment.md for what each service is actually for. In short:
# the backend embeds the LightRAG Python library directly and writes its
# knowledge base to <project_dir>/.sdlicit/knowledge/lightrag_workdir on
# disk, it does not call the lightrag service over the network. lightrag
# here is a separate standalone server pointed at that same directory,
# useful only for browsing the knowledge graph through its own WebUI. Ollama
# is only needed when a project's config.yaml sets provider: ollama.
# sdlicit-db is provisioned (pgvector and AGE installed) but nothing in the
# current codebase connects to it yet, LightRAG runs in JSON file storage
# mode below. It is not started by default, see the profile note on it.
# ---------------------------------------------------------------------------
services:
  sdlicit-backend:
    container_name: sdlicit_backend
    build:
      context: ..
      dockerfile: Dockerfile
    # Matches the mounted project directory's owner on the host. The image
    # defaults to 1000:1000, override with UID/GID env vars (export UID GID
    # before `docker compose up`, or `UID=$(id -u) GID=$(id -g) docker
    # compose up`) if your user is not 1000 on the host.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ${SDLICIT_PROJECT_DIR:-../examples/demo}:/data/project
    networks:
      - sdlicit_net

  sdlicit-db:
    profiles: ["postgres"]
    container_name: sdlicit_postgres
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sdlicit
      POSTGRES_PASSWORD: sdlicit
      POSTGRES_DB: sdlicit
    volumes:
      - sdlicit_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - sdlicit_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlicit -d sdlicit"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    container_name: sdlicit_ollama
    image: ollama/ollama:0.21.0
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - sdlicit_ollama:/root/.ollama
      - ./ollama:/models:ro
    ports:
      - "11434:11434"
    networks:
      - sdlicit_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  lightrag:
    container_name: sdlicit_lightrag
    build:
      context: ./lightrag
      dockerfile: Dockerfile
    ports:
      - "9621:9621"
    volumes:
      # Points at a project's knowledge-base workdir (created by the backend
      # under <project_dir>/.sdlicit/knowledge/lightrag_workdir). Override
      # with SDLICIT_PROJECT_DIR=/path/to/project before `docker compose up`.
      - ${SDLICIT_PROJECT_DIR:-..}/.sdlicit/knowledge/lightrag_workdir:/app/data/rag_storage

    environment:
      # Server
      - HOST=0.0.0.0
      - PORT=9621
      - WORKING_DIR=/app/data/rag_storage
      # LLM — use Ollama via the internal Docker network
      - LLM_BINDING=ollama
      - LLM_BINDING_HOST=http://ollama:11434
      - LLM_MODEL=qwen3.5:4b-sdlicit
      - OLLAMA_LLM_NUM_CTX=32768
      # Embedding
      # - EMBEDDING_BINDING=ollama
      # - EMBEDDING_BINDING_HOST=http://ollama:11434
      # - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIM=3072
      # - OLLAMA_EMBEDDING_NUM_CTX=2048
      # Storage — JSON/file-based (matches existing data)
      - LIGHTRAG_KV_STORAGE=JsonKVStorage
      - LIGHTRAG_DOC_STATUS_STORAGE=JsonDocStatusStorage
      - LIGHTRAG_GRAPH_STORAGE=NetworkXStorage
      - LIGHTRAG_VECTOR_STORAGE=NanoVectorDBStorage
      - MAX_ASYNC=4
      - MAX_PARALLEL_INSERT=2
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - sdlicit_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sdlicit_pgdata:
  sdlicit_ollama:

networks:
  sdlicit_net:
    driver: bridge
