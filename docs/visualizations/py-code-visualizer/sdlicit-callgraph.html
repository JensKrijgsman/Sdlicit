<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sdlicit Server - Code Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #5D2E8C;
            --secondary-color: #2962FF;
            --accent-color: #00C853;
            --danger-color: #F44336;
            --warning-color: #FF9800;
            --text-color: #212121;
            --text-secondary: #757575;
            --background-color: #f8f9fa;
            --card-bg-color: #ffffff;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0,0,0,0.1);
            --node-constructor: #E53935;
            --node-method: #2962FF;
            --node-function: #00C853;
            --node-property: #FF6D00;
            --node-async: #AA00FF;
            --node-private: #757575;
            --link-normal: #616161;
            --link-cycle: #F44336;
        }
        body.dark-mode {
            --primary-color: #9C64FE;
            --secondary-color: #448AFF;
            --accent-color: #4CD964;
            --text-color: #EEEEEE;
            --text-secondary: #BDBDBD;
            --background-color: #121212;
            --card-bg-color: #1E1E1E;
            --border-color: #333333;
            --shadow-color: rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px var(--shadow-color);
        }
        .project-title {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .project-title i { margin-right: 0.5rem; }
        .header-controls { display: flex; gap: 0.75rem; }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .theme-toggle:hover { background: rgba(255, 255, 255, 0.3); }
        .layout-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 300px;
            background-color: var(--card-bg-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        .controls-section {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .controls-section h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }
        .controls-section h3 i { margin-right: 0.5rem; }
        .search-box { position: relative; margin-bottom: 1rem; }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-color);
            background-color: var(--card-bg-color);
        }
        .search-box i {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-color);
            background-color: var(--card-bg-color);
            margin-bottom: 1rem;
        }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: var(--secondary-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .graph-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: var(--card-bg-color);
        }
        #graph-svg { width: 100%; height: 100%; }
        .node { cursor: pointer; }
        .node circle { stroke-width: 2px; stroke: white; }
        .node text { font-size: 10px; pointer-events: none; }
        .link { fill: none; stroke-opacity: 0.6; }
        .link.cycle { stroke: var(--link-cycle); stroke-dasharray: 5, 5; }
        .node.highlighted circle { stroke: #FFD700; stroke-width: 4px; }
        .node.faded { opacity: 0.2; }
        .link.faded { opacity: 0.1; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }
        .stat-item {
            background-color: var(--background-color);
            padding: 0.75rem;
            border-radius: 4px;
            text-align: center;
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); }
        .legend { padding: 1rem; }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        .tooltip {
            position: absolute;
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.75rem;
            font-size: 0.85rem;
            box-shadow: 0 2px 10px var(--shadow-color);
            pointer-events: none;
            z-index: 1000;
            max-width: 300px;
        }
        .tooltip h4 { margin-bottom: 0.5rem; color: var(--primary-color); }
        .tooltip p { margin: 0.25rem 0; color: var(--text-secondary); }
    </style>
</head>

                <div class="legend-item">

                <div class="legend-item">

                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background-color: var(--node-private);"></span>
                    Private
                </div>
            </div>
        </aside>
        <div class="graph-container" id="graphContainer">
