[project]
name = "sdlicit"
version = "0.1.0"
description = "Sdlicit — knowledge-grounded LLM framework for structured SDLC artifact creation (ADRs, SRS, BDD/Gherkin) using RAG, Socratic prompting and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Jens Krijgsman" }]

dependencies = [
    "python-dotenv==1.2.2",
    "openai==2.29.0",
    "lightrag-hku==1.4.11",
    "ollama==0.6.1",             # lightrag runtime dep — prevents pipmaster from calling pip
    "dspy==3.1.3",                # Programmatic prompt optimization (signatures, MIPRO, GEPA)
    "gherkin-official>=29.0.0",  # Official Cucumber Gherkin parser (AST validation)
    "rich>=14.3.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "mcp>=1.9.0,<2", # v2 renamed FastMCP -> MCPServer; main.py still targets the v1 API
    "pyyaml>=6.0",
    "pymupdf>=1.27.2",
    "tiktoken>=0.8.0",           # Accurate token counting for usage accounting
    "numpy>=2.4",                # Vector math for traceability similarity scoring
    "scikit-learn>=1.6",         # TF-IDF / NMF / cosine similarity for traceability analysis
]

[project.scripts]
sdlicit-server = "sdlicit.main:_run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlicit"]

[dependency-groups]
# Install with: uv sync --group examples
# Needed only to run the notebooks under examples/ (e.g. jabref_replay/).
examples = [
    "notebook>=7.5.6",
    "ipykernel>=7.2.0",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-asyncio>=0.25",
    "ruff==0.15.7",
    "mypy>=1.19.1",
]
# Install with: uv sync --group docs
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Body() as default args is the required idiom,
# not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
