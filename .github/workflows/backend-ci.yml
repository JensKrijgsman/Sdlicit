name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "cli/**"
      - "test/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "cli/**"
      - "test/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .
        continue-on-error: true # codebase predates ruff format adoption; not yet a hard gate

      - name: mypy
        run: uv run mypy src
        continue-on-error: true # strict mode, not yet a hard gate

      - name: Compile check (backend + CLI)
        run: uv run python -m compileall -q src cli

      - name: pytest
        run: uv run pytest -v
